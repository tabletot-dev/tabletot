[project]
name = "menu-resolver"
version = "0.3.0"
description = "Deterministic menu item matching engine + LLM intent extraction for voice ordering kiosk"
requires-python = ">=3.11"
dependencies = [
    "rapidfuzz>=3.0.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "sounddevice>=0.4.6",
    "pynput>=1.7.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
]
# Install these only when testing with other providers
openai = [
    "openai>=1.0.0",
]
gemini = [
    "google-generativeai>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
