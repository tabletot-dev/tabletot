      "Fries",
      "Sandwiches",
      "Focaccia",
      "Burgers",
      "Pastas",
      "Hot Coffee",
      "Signature Coffee",
      "Iced Coffee",
      "Tea & Chocolate",
      "Desserts"
    ];

    const voicePrompts = [
      "How can I help you?",
      "Vegan options?",
      "Best iced coffee?",
      "Something sweet?",
      "Breakfast recommendations?"
    ];

    const state = {
      view: "home",
      category: "All",
      diet: "all",
      selectedItemId: "avocado-toast",
      heroIndex: 0,
      idlePromoIndex: 0,
      voicePromptIndex: 0,
      voiceSheetOpen: false,
      cart: { "spanish-latte": 1, "avocado-toast": 1 },
      upsellItemId: "",
      search: "",
      toast: "",
      orderPlaced: false,
      orderSentAt: null,
      serviceRequested: false,
      billRequested: false,
      waterRequested: false
    };

    const app = document.getElementById("app");
    let toastTimer = null;
    let idleTransitionTimer = null;
    let lastScrollTop = 0;

    function money(value) {
      return `₹${value.toFixed(0)}`;
    }

    function displayPrice(itemOrValue) {
      if (typeof itemOrValue === "number") return money(itemOrValue);
      return itemOrValue.priceLabel || money(itemOrValue.price);
    }

    function getItem(id) {
      return menuItems.find((item) => item.id === id);
    }

    function cartItems() {
      return Object.entries(state.cart)
        .filter(([, qty]) => qty > 0)
        .map(([id, qty]) => ({ ...getItem(id), qty }));
    }

    function cartCount() {
      return cartItems().reduce((sum, item) => sum + item.qty, 0);
    }

    function subtotal() {
      return cartItems().reduce((sum, item) => sum + item.price * item.qty, 0);
    }

    function tax() {
      return subtotal() * 0.08;
    }

    function total() {
      return subtotal() + tax();
    }

    function filteredItems() {
      const query = state.search.trim().toLowerCase();
      return menuItems.filter((item) => {
        const matchesCategory = state.category === "All" || item.category === state.category;
        const matchesSearch = !query || `${item.name} ${item.short} ${item.category}`.toLowerCase().includes(query);
        const matchesDiet =
          state.diet === "all" ||
          (state.diet === "veg" && item.isVeg) ||
          (state.diet === "nonveg" && !item.isVeg);
        return matchesCategory && matchesSearch && matchesDiet;
      });
    }

    function heroItems() {
      return ["avocado-toast", "spanish-latte", "affogato"].map(getItem).filter(Boolean);
    }

    function dessertItems() {
      return menuItems.filter((item) => item.type === "dessert");
    }

    function beverageItems() {
      return menuItems.filter((item) => item.type === "beverage");
    }

    function pairingsFor(item) {
      return (item.pairings || []).map(getItem).filter(Boolean);
    }

    function idlePromoItems() {
      return [
        {
          id: "ad-travel",
          title: "Weekend Escape",
          copy: "Discover limited-time city breaks, spa stays, and last-minute travel offers.",
          image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80"
        },
        {
          id: "ad-audio",
          title: "Studio Sound",
          copy: "Wireless headphones, deep bass, and everyday listening made beautifully simple.",
          image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1600&q=80"
        },
        {
          id: "ad-fashion",
          title: "New Season Edit",
          copy: "Lightweight essentials, clean tailoring, and fresh arrivals for the week ahead.",
          image: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1600&q=80"
        },
        {
          id: "ad-wellness",
          title: "Reset & Recharge",
          copy: "Wellness offers, fitness plans, and recovery treatments curated for busy days.",
          image: "https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=80"
        }
      ];
    }

    function recommendationsFor(item) {
      const paired = pairingsFor(item);
      if (paired.length) return paired.slice(0, 2);

      const preferredType = item.type === "beverage" ? "food" : "beverage";
      return menuItems
        .filter((candidate) => candidate.id !== item.id && candidate.type === preferredType)
        .slice(0, 2);
    }

    function showToast(message) {
      state.toast = message;
      render();
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toast = "";
        render();
      }, 2200);
    }

    function setView(view) {
      state.view = view;
      render();
    }

    function scrollToMenuContinuation() {
      requestAnimationFrame(() => {
        const menu = document.getElementById("menu-continuation");
        if (menu) menu.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    function openItem(id) {
      state.selectedItemId = id;
      state.view = "detail";
      render();
    }

    function addToCart(id, qty = 1) {
      state.cart[id] = (state.cart[id] || 0) + qty;
      state.upsellItemId = id;
      showToast(`${getItem(id).name} added to order`);
    }

    function updateQty(id, delta) {
      const next = (state.cart[id] || 0) + delta;
      if (next <= 0) {
        delete state.cart[id];
        if (state.upsellItemId === id) state.upsellItemId = "";
      } else {
        state.cart[id] = next;
        state.upsellItemId = id;
      }
      render();
    }

    function confirmOrder() {
      if (!cartCount()) {
        showToast("Add something before sending the order");
        return;
      }
      state.orderPlaced = true;
      state.orderSentAt = Date.now();
      state.billRequested = false;
      state.serviceRequested = false;
      state.waterRequested = false;
      state.idlePromoIndex = 0;
      state.view = "confirmation";
      clearTimeout(idleTransitionTimer);
      const sentAt = state.orderSentAt;
      idleTransitionTimer = setTimeout(() => {
        if (state.view === "confirmation" && state.orderSentAt === sentAt) {
          state.view = "idle";
          render();
        }
      }, 5000);
      render();
    }

    function requestService() {
      state.serviceRequested = true;
      showToast("A server has been notified");
    }

    function requestBill() {
      state.billRequested = true;
      showToast("Bill requested for Table 14");
    }

    function requestWater() {
      state.waterRequested = true;
      showToast("Water requested for Table 14");
    }

    function simulateVoice() {
      state.voiceSheetOpen = true;
      state.voicePromptIndex = 0;
      render();
    }

    function closeVoiceSheet() {
      state.voiceSheetOpen = false;
      render();
    }

    function orderProgress() {
      if (!state.orderPlaced || !state.orderSentAt) return 0;
      const minutes = (Date.now() - state.orderSentAt) / 1000;
      return Math.min(92, Math.round(28 + minutes * 3));
    }

    function stageLabel() {
      const progress = orderProgress();
      if (progress < 45) return "Queued";
      if (progress < 80) return "Cooking";
      return "Plating";
    }

    function tagMarkup(tag) {
      const map = {
        "Chef's Pick": "tag-dark",
        "Best Seller": "tag-accent",
        "Signature": "tag-light",
        "New": "tag-green",
        "Pairs Well": "tag-light",
        "Quick Add": "tag-light"
      };
      return `<span class="tag ${map[tag] || "tag-light"}">${tag}</span>`;
    }

    function dishCard(item) {
      const qty = state.cart[item.id] || 0;
      const recommendations = recommendationsFor(item);
      return `
        <article class="dish-card" data-action="open-item" data-id="${item.id}" role="button" tabindex="0">
          <div class="dish-media" style="background-image:url('${item.image}')">
            <div class="dish-tags">${item.tags.slice(0, 2).map(tagMarkup).join("")}</div>
          </div>
          <div class="dish-body">
            <div class="dish-text">
              <h3>${item.name}</h3>
              <p>${item.short}</p>
            </div>
            <div class="dish-meta">
              <strong>${displayPrice(item)}</strong>
              ${qty ? `
                <div class="card-stepper" aria-label="${item.name} quantity">
                  <button data-action="decrease-item" data-id="${item.id}" aria-label="Decrease ${item.name}">-</button>
                  <span>${qty}</span>
                  <button data-action="increase-item" data-id="${item.id}" aria-label="Increase ${item.name}">+</button>
                </div>
              ` : `<button class="chip-action" data-action="add-item" data-id="${item.id}">Add</button>`}
            </div>
            ${state.upsellItemId === item.id && recommendations.length ? `
              <div class="card-pairing-panel">
                <div>
                  <p class="eyebrow">Pairs well with</p>
                  <strong>Complete it with</strong>
                </div>
                <div class="card-pairing-list">
                  ${recommendations.map((pairedItem) => `
                    <button class="pairing-chip" data-action="add-item" data-id="${pairedItem.id}">
                      <span class="pairing-thumb" style="background-image:url('${pairedItem.image}')"></span>
                      <span class="pairing-info">
                        <span class="pairing-topline">
                          <span class="pairing-name">${pairedItem.name}</span>
                          <small>${displayPrice(pairedItem)}</small>
                        </span>
                        <span class="pairing-add">Add</span>
                      </span>
                    </button>
                  `).join("")}
                </div>
              </div>
            ` : ""}
          </div>
        </article>

    }

      return `

    }

              <p class="eyebrow">Now showing</p>
              <strong>${lead.title}</strong>
              <span>${lead.copy}</span>
              <div class="idle-dots">
                ${promos.map((_, index) => `<span class="idle-dot ${index === state.idlePromoIndex % promos.length ? "active" : ""}"></span>`).join("")}
              </div>
            </div>
          </div>

          <div class="idle-status panel">
            <div class="idle-status-copy">
              <p class="eyebrow">Order Status</p>
              <h2>Your order is being prepared</h2>
              <p class="hero-sub">${itemsLabel}. The kitchen is currently at the <strong>${stageLabel().toLowerCase()}</strong> stage for Table 14.</p>
            </div>
            <div class="idle-progress-box">
              <div class="progress-meta"><span>${stageLabel()}</span><strong>${progress}%</strong></div>
              <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
            </div>
          </div>

          <div class="idle-cta-row">
            <button class="primary-btn" data-action="go-menu">Order More</button>
            <button class="secondary-btn" data-action="request-bill">${state.billRequested ? "Bill Requested" : "Request Bill"}</button>
            <button class="water-cta ${state.waterRequested ? "active" : ""}" data-action="request-water" aria-label="Request water">
              ${waterIcon()}
            </button>
          </div>
        </section>
      `;
    }

    function waitingView() {
      const progress = orderProgress();
      const desserts = dessertItems().slice(0, 3);
      const drinks = beverageItems().slice(0, 3);
      return `
        <section class="view waiting-view">
          <div class="status-hero">
            <div class="status-copy">
              <p class="eyebrow light-text">Order in progress</p>
              <h1>Your meal is on the way.</h1>
              <p class="hero-sub light-text">Use the table screen for desserts, drinks, or a quick service request while you wait.</p>
            </div>
            <div class="progress-box">
              <div class="progress-meta"><span>${stageLabel()}</span><strong>${progress}%</strong></div>
              <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
            </div>
          </div>

          <div class="waiting-grid">
            <div class="panel">
              <div class="section-title inline">
                <div>
                  <p class="eyebrow">Need anything else?</p>
                  <h2>Service and support</h2>
                </div>
              </div>
              <div class="action-stack">
                <button class="secondary-btn wide" data-action="request-service">${state.serviceRequested ? "Server Requested" : "Request Server"}</button>
                <button class="secondary-btn wide" data-action="go-bill">View Bill</button>
              </div>
            </div>

            <div class="panel">
              <div class="section-title inline">
                <div>
                  <p class="eyebrow">Dessert suggestions</p>
                  <h2>Save room for one more thing</h2>
                </div>
              </div>
              <div class="compact-grid">${desserts.map(compactCard).join("")}</div>
            </div>

            <div class="panel">
              <div class="section-title inline">
                <div>
                  <p class="eyebrow">Another round?</p>
                  <h2>Coffee and something chilled</h2>
                </div>
              </div>
              <div class="compact-grid">${drinks.map(compactCard).join("")}</div>
            </div>
          </div>
        </section>
      `;
    }

    function billView() {
      return `
        <section class="view bill-view">
          <div class="split-layout">
            <div class="panel scroll-panel">
              <div class="section-title">
                <div>
                  <p class="eyebrow">Itemized bill</p>
                  <h2>Review before asking to settle</h2>
                </div>
              </div>
              <div class="bill-list">
                ${cartItems().map((item) => `
                  <div class="bill-row">
                    <span>${item.qty} × ${item.name}</span>
                    <strong>${money(item.qty * item.price)}</strong>
                  </div>
                `).join("")}
                <div class="summary-line"><span>Subtotal</span><strong>${money(subtotal())}</strong></div>
                <div class="summary-line"><span>Tax</span><strong>${money(tax())}</strong></div>
                <div class="summary-line total-line"><span>Total</span><strong>${money(total())}</strong></div>
              </div>
            </div>

            <aside class="panel summary-panel">
              <p class="eyebrow">Settle up</p>
              <h2>Choose the next step</h2>
              <button class="primary-btn wide" data-action="request-bill">${state.billRequested ? "Bill Requested" : "Request Bill at Table"}</button>
              <button class="secondary-btn wide" data-action="request-service">Request Server</button>
              <button class="secondary-btn wide" data-action="go-menu">Continue Ordering</button>
              <div class="summary-note">Once requested, a server brings the card reader directly to your table.</div>
            </aside>
          </div>
        </section>
      `;
    }

    function utilitySectionMarkup() {
      return `
        <div class="utility-layout">
          <div class="utility-row utility-row-two">
            <button class="utility-card" data-action="info-toast" data-message="Please ask the Silver team for allergen guidance, vegetarian recommendations, and ingredient details before confirming your order.">
              <p class="eyebrow">Dietary Information</p>
              <strong>Prepared for every preference</strong>
              <span>Vegetarian-friendly dishes, egg-based breakfast options, and support for allergen questions are available on request.</span>
            </button>
            <button class="utility-card" data-action="info-toast" data-message="Please ask the Silver team for the current Wi-Fi network name and password.">
              <p class="eyebrow">Wi-Fi</p>
              <strong>Stay connected at the table</strong>
              <span>Ask the team for today’s network and password if you’d like to work, browse, or stay online while you dine.</span>
            </button>
          </div>

          <div class="panel utility-about-panel">
            <p class="eyebrow">About Us</p>
            <h2>Silver Specialty Coffee</h2>
            <p class="hero-sub">Silver Specialty Coffee is a bright all-day cafe built around carefully brewed coffee, generous breakfast plates, sweet comforts, and a relaxed table-side experience. The space is designed for slow mornings, casual meetings, and easy catch-ups, with a menu that balances comfort classics and signature house favorites.</p>
          </div>

          <div class="utility-row utility-row-two">
            <div class="utility-card utility-card-static">
              <p class="eyebrow">Chef's Note</p>
              <strong>Fresh, simple, and made to linger over</strong>
              <span>Our kitchen focuses on approachable breakfast and brunch plates with clean flavors, seasonal touches, and dishes that pair naturally with specialty coffee.</span>
            </div>
            <div class="utility-card utility-card-static">
              <p class="eyebrow">Hours</p>
              <strong>Open daily</strong>
              <span>Monday to Thursday: 8:00 AM - 10:00 PM</span>
              <span>Friday to Sunday: 8:00 AM - 11:00 PM</span>
            </div>
          </div>
        </div>
      `;
    }

    function utilityView() {
      return `
        <section class="view utility-view">
          ${utilitySectionMarkup()}
        </section>
      `;
    }

    function voiceSheet() {
      return `
        <div class="voice-sheet-backdrop" data-action="close-voice"></div>
        <section class="voice-sheet" aria-label="Voice assistant mockup">
          <div class="voice-sheet-handle"></div>
          <div class="voice-sheet-top">
            <div class="voice-active-mark">
              <div class="voice-orb">
                ${micIcon()}
                <span class="voice-ring voice-ring-a"></span>
                <span class="voice-ring voice-ring-b"></span>
              </div>
            </div>
            <button class="voice-close" data-action="close-voice" aria-label="Close voice assistant">Close</button>
          </div>
          <div class="voice-sheet-copy">
            <p class="eyebrow">Listening</p>
            <h2>Waiter assistant is active</h2>
          </div>
          <div class="voice-wave" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="voice-prompt-list">
            ${voicePrompts.map((prompt, index) => `
              <div class="voice-prompt ${index === state.voicePromptIndex ? "active" : ""}">
                ${prompt}
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderView() {
      if (state.view === "home") return homeView();
      if (state.view === "menu") return menuView();
      if (state.view === "detail") return detailView();
      if (state.view === "cart") return cartView();
      if (state.view === "confirmation") return confirmationView();
      if (state.view === "idle") return idleView();
      if (state.view === "waiting") return waitingView();
      if (state.view === "bill") return billView();
      return utilityView();
    }

    function render() {
      const existingContent = app.querySelector(".app-content");
      if (existingContent) {
        lastScrollTop = existingContent.scrollTop;
      }
      const chromeHidden = state.view === "idle";

      app.innerHTML = `
        <div class="app-shell">
          <div class="tablet-frame ${chromeHidden ? "idle-frame" : ""}">
            ${chromeHidden ? "" : `
            <header class="app-header">
              <div class="brand-block" data-action="go-home">
                <div class="brand-mark">T</div>
                <div class="brand-copy">
                  <strong>Tabletot</strong>
                  <span>Table 14</span>
                </div>
              </div>
              <div class="header-tools">
                <button class="tool-btn voice-button" data-action="voice" aria-label="Speak to order">
                  ${micIcon()}
                </button>
                <nav class="top-nav" aria-label="Primary navigation">
                  <button class="nav-btn ${state.view === "home" ? "active" : ""}" data-action="go-home">Home</button>
                  <button class="nav-btn ${state.view === "menu" ? "active" : ""}" data-action="go-menu">Menu</button>
                  <button class="nav-btn ${state.view === "waiting" || state.view === "confirmation" || state.view === "idle" ? "active" : ""}" data-action="go-waiting">Status</button>
                  <button class="nav-btn ${state.view === "bill" ? "active" : ""}" data-action="go-bill">Bill</button>
                </nav>
                <button class="tool-btn dark cart-button" data-action="go-cart" aria-label="Open cart">
                  ${cartIcon()}
                  ${cartCount() ? `<span class="cart-count">${cartCount()}</span>` : ""}
                </button>
              </div>
            </header>
            `}

            <main class="app-content ${chromeHidden ? "idle-content" : ""}">
              ${renderView()}
            </main>
          </div>
          ${state.voiceSheetOpen ? voiceSheet() : ""}
          ${state.toast ? `<div class="toast">${state.toast}</div>` : ""}
        </div>
      `;

      const nextContent = app.querySelector(".app-content");
      if (nextContent) {
        nextContent.scrollTop = lastScrollTop;
        nextContent.addEventListener("scroll", () => {
          lastScrollTop = nextContent.scrollTop;
        }, { passive: true });
      }

    }

    app.addEventListener("click", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;

      const { action, id, category, message } = target.dataset;
      if (target.classList.contains("chip-action") || target.classList.contains("mini-plus")) {
        event.stopPropagation();
      }

      if (action === "go-home") setView("home");
      if (action === "go-menu") {
        state.view = "menu";
        render();
        scrollToMenuContinuation();
      }
      if (action === "go-cart") setView("cart");
      if (action === "go-waiting") setView(state.orderPlaced ? "idle" : "confirmation");
      if (action === "go-idle") setView("idle");
      if (action === "go-bill") setView("bill");
      if (action === "go-utility") setView("utility");
      if (action === "voice") simulateVoice();
      if (action === "close-voice") closeVoiceSheet();
      if (action === "set-category") {
        state.category = category;
        state.view = "menu";
        render();
      }
      if (action === "set-diet") {
        state.diet = target.dataset.diet;
        state.view = "menu";
        render();
      }
      if (action === "open-item") openItem(id);
      if (action === "add-item") addToCart(id);
      if (action === "increase-item") updateQty(id, 1);
      if (action === "decrease-item") updateQty(id, -1);
      if (action === "confirm-order") confirmOrder();
      if (action === "request-service") requestService();
      if (action === "request-bill") requestBill();
      if (action === "request-water") requestWater();
      if (action === "info-toast") showToast(message);
    });

    setInterval(() => {
      let needsRender = false;

      if (state.voiceSheetOpen) {
        state.voicePromptIndex = (state.voicePromptIndex + 1) % voicePrompts.length;
        needsRender = true;
      }

      if (state.view === "home") {
        const content = app.querySelector(".app-content");
        if (content && content.scrollTop > 40) {
          if (needsRender) render();
          return;
        }
        state.heroIndex = (state.heroIndex + 1) % heroItems().length;
        render();
        return;
      }
      if (state.view === "idle") {
        state.idlePromoIndex = (state.idlePromoIndex + 1) % idlePromoItems().length;
        render();
        return;
      }
      if (state.orderPlaced && (state.view === "waiting" || state.view === "confirmation")) {
        render();
        return;
      }
      if (needsRender) {
        render();
      }
    }, 2000);

    render();
  </script>
</body>
</html>
